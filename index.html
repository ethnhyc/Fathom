    $("#mp").innerHTML = `${hud(g)}
      <article class="panel card" id="mpCard">
        <div class="label">Prompt ${g.seq + 1} of ${g.list.length} · room ${esc(code)}</div>
        <h2 class="prompt"></h2>
        <div><div class="timer" id="mpTimer"><i id="mpTimerFill"></i></div><div class="clock" style="margin-top:6px"><span>Rare, and not what your friends will say.</span><span class="sec" id="mpSec">${g.secs}s</span></div></div>
        <div id="mpAnswerArea">
          <form class="answer" id="mpForm" autocomplete="off"><label class="sr" for="mpAnswer">Your answer</label><input id="mpAnswer" type="text" placeholder="Type an answer" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" maxlength="80"><button class="btn primary" type="submit">Lock in</button></form>
        </div>
        <div class="feedback" id="mpFb" aria-live="polite"></div>
        <div class="tried" id="mpTried"></div>
        <div class="label">Locked in</div>
        <div class="mp-players" id="mpLocked"></div>
      </article>`;
    $("#mpCard .prompt").textContent = p.q;
    paintLocked(g);
    $("#mpForm").onsubmit = (e) => { e.preventDefault(); submit($("#mpAnswer").value, g, p); };
    setTimeout(() => $("#mpAnswer") && $("#mpAnswer").focus({ preventScroll: true }), 60);
  }
  function paintLocked(g) { const el = $("#mpLocked"); if (el) el.innerHTML = chipList(g, g); }

  function startTimer(g) {
    const total = g.secs * 1000; let lastSec = null;
    const loop = (now) => {
      if (!R) return;
      const left = Math.max(0, total - (now - phaseT0));
      const fill = $("#mpTimerFill"), bar = $("#mpTimer"), sec = $("#mpSec");
      if (fill) fill.style.transform = `scaleX(${left / total})`;
      if (bar) { bar.classList.toggle("low", left < 10000 && left >= 5000); bar.classList.toggle("crit", left < 5000); }
      const s = Math.ceil(left / 1000);
      if (sec && s !== lastSec) { sec.textContent = s + "s"; if (s <= 5 && s > 0 && lastSec !== null && !myAns) SND.tick(); lastSec = s; }
      if (left <= 0 && !myAns && !timedOut) { timedOut = true; lockNone(g); }
      const hh = hostPeer(); if (isMeHost(hh)) hostTick(pres(hh).g);
      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);
  }
  function stopTimer() { cancelAnimationFrame(raf); raf = 0; }

  function submit(raw, g, p) {
    if (myAns || judging || lastKey !== `${g.gid}|${g.seq}|q`) return;
    const v = String(raw || "").trim(); if (!v) return;
    const r = F.match(p, v);
    if (r.status === "ok") return lockIn(g, p, r.tier, r.display);
    if (tried.some((t) => F.norm(t) === F.norm(v))) return refuse(v, "Already refused. Try something else.", true);
    if (A.judgeReady() && v.length >= 2) {
      const ctl = new AbortController(); judging = ctl;
      const fb = $("#mpFb"); fb.className = "feedback"; fb.innerHTML = `<span class="spin"></span><span>Not on our chart. Asking ${A.judgeName || "Claude"} whether <b>${esc(v)}</b> counts…</span>`;
      A.judgeAnswer(p, v, ctl.signal).then((res) => {
        if (judging !== ctl) return; judging = null;
        if (res && res.valid === true) lockIn(g, p, Math.max(0, Math.min(4, (parseInt(res.tier, 10) || 3) - 1)), typeof res.name === "string" && res.name.trim() ? res.name.trim() : v);
        else refuse(v, res && typeof res.why === "string" && res.why ? (A.judgeName || "Claude") + " says no: " + clip(res.why, 100) : (A.judgeName || "Claude") + " says that doesn't fit.");
      }).catch(() => { if (judging !== ctl) return; judging = null; refuse(v, "Not on our chart. Try another."); });
      return;
    }
    refuse(v, "Not on our chart. Try another.");
  }
  function refuse(v, msg, noLog) {
    if (!noLog) { tried.push(v); const t = $("#mpTried"); if (t) t.innerHTML = tried.slice(-6).map((x) => `<span>${esc(x)}</span>`).join(""); }
    const fb = $("#mpFb"), form = $("#mpForm");
    if (fb) { fb.className = "feedback bad"; fb.textContent = msg; }
    if (form) { form.classList.remove("shake", "bad"); void form.offsetWidth; form.classList.add("shake", "bad"); setTimeout(() => form.classList.remove("bad"), 900); }
    SND.refuse();
    const input = $("#mpAnswer"); if (input) { input.value = ""; input.focus({ preventScroll: true }); }
  }
  function lockIn(g, p, tier, disp) {
    if (lastKey !== `${g.gid}|${g.seq}|q` || myAns) return;
    const key = clip(F.norm(disp), 40);
    myAns = { gid: g.gid, seq: g.seq, tier };
    hist = hist.filter((x) => x[0] !== g.seq).concat([[g.seq, tier, key, clip(disp, 40)]]);
    setPres({ a: { gid: g.gid, seq: g.seq }, hist });
    A.recordCab(p, tier);
    SND.blip(2);
    const area = $("#mpAnswerArea");
    if (area) area.innerHTML = `<div class="locked-in">Locked in: <b></b>. Waiting for the others…</div>`;
    if (area) area.querySelector("b").textContent = disp;
    const fb = $("#mpFb"); if (fb) { fb.className = "feedback"; fb.textContent = ""; }
  }
  function lockNone(g) {
    if (myAns) return;
    if (judging) { judging.abort(); judging = null; }
    myAns = { gid: g.gid, seq: g.seq, tier: -1 };
    hist = hist.filter((x) => x[0] !== g.seq).concat([[g.seq, -1, "", ""]]);
    setPres({ a: { gid: g.gid, seq: g.seq }, hist });
    SND.miss();
    const area = $("#mpAnswerArea"); if (area) area.innerHTML = `<div class="locked-in">Time's up. You'll stay at the surface on this one.</div>`;
  }

  function startReveal(g, h) {
    const key = `${g.gid}|${g.seq}`;
    const p = F.prep(byId.get(g.list[g.seq]));
    renderBoard(g, h);
    if (revealedKey === key || A.isDiving()) return;
    revealedKey = key;
    setTimeout(() => {
      if (!R || !lastKey.startsWith(key)) return;
      const rows = roundRows(lastG, g.seq).slice(0, 10);
      if (!rows.length) return;
      const meIdx = rows.findIndex((r) => r.me);
      A.dive({
        q: p.q, said: `Round ${g.seq + 1} of ${g.list.length}`, multi: true,
        divers: rows.map((r) => ({ name: r.name, said: r.disp || "", tier: r.dup ? -1 : r.tier, pts: r.pts, base: r.pts, bonus: 0, mult: 1, isMe: r.me, color: r.color, tag: r.dup ? "Same answer" : r.tier < 0 ? "No answer" : null })),
        primary: meIdx,
        hooks: {
          land: () => { const m = rows[meIdx]; if (!m) return; if (m.dup) SND.snap(); else if (m.tier >= 0) { SND.thud(m.tier); if (m.tier === 5) SND.pearl(); else SND.accept(m.tier); } },
          done: () => { if (R && lastKey.startsWith(key)) renderBoard(lastG, hostPeer()); },
        },
      });
    }, 450);
  }

  function renderBoard(g, h) {
    const p = F.prep(byId.get(g.list[g.seq]));
    const rows = roundRows(g, g.seq).sort((a, b) => b.pts - a.pts || b.tier - a.tier);
    const st = standings(g), last = g.seq >= g.list.length - 1, iAmHost = isMeHost(h);
    const mine = st.find((s) => s.me); if (mine) O.setDepth(mine.metres);
    const deep = p.tiers[4].map((x) => x.display);
    const picks = F.shuffle(deep.slice()).slice(0, 3);
    $("#mp").innerHTML = `${hud(g)}
      <article class="panel card mp-board">
        <div class="label">Round ${g.seq + 1} of ${g.list.length}</div>
        <h2 class="prompt"></h2>
        <div class="mp-rows">${rows.map((r) => `<div class="mp-row${r.me ? " me" : ""}${r.dup ? " dup" : ""}" style="--c:${r.color}">${r.tier >= 0 && !r.dup ? TI(r.tier) : `<span class="dot"></span>`}<div class="who"><b>${esc(r.name)}${r.me ? " (you)" : ""}</b><span>${r.tier >= 0 ? esc(r.disp) : "No answer"}</span></div><div class="pts">${r.dup ? "0 m" : r.tier < 0 ? "0 m" : "+" + F.fmtM(r.pts * 10)}<small>${r.dup ? "Same answer" : r.tier >= 0 ? F.TIERS[r.tier].name : "Missed"}</small></div></div>`).join("")}</div>
        ${A.S.settings.spoilers ? `<div class="reveal">
          <div class="row"><span class="label">Pearl</span><span><span class="pearl-a">${esc(p.pearlItem.display)}</span></span></div>
          ${picks.length ? `<div class="row"><span class="label">Deep cuts</span><span>${picks.map(esc).join(" · ")}</span></div>` : ""}
        </div>` : ""}
        <div class="label">Standings</div>
        ${standingsHTML(st)}
        ${iAmHost ? `<button class="btn primary wide" type="button" id="mpNext">${ICON(last ? "crown" : "down")}${last ? "Final standings" : "Next prompt"}</button>` : `<p class="hint mp-wait"><span class="spin"></span>Waiting for ${esc(hostName(h))} to ${last ? "reveal the final standings" : "start the next prompt"}…</p>`}
      </article>`;
    $("#mp .mp-board .prompt").textContent = p.q;
    if (iAmHost) $("#mpNext").onclick = () => { if (last) setG({ phase: "over" }); else setG({ phase: "q", seq: g.seq + 1 }); };
  }

  function renderOver(g, h) {
    const st = standings(g), iAmHost = isMeHost(h);
    const k = g.gid + "|over";
    if (overSound !== k) {
      overSound = k; if (st[0] && st[0].me) SND.pearl(); else SND.ping();
      const mine = st.find((x) => x.me); if (mine && A.updateOceanProgress) A.updateOceanProgress(mine.metres);
    }
    const order = st.length >= 3 ? [1, 0, 2] : st.map((_, i) => i);
    $("#mp").innerHTML = `${hud(g)}
      <article class="panel card mp-over">
        <div class="label">Final standings · ${g.list.length} prompt${g.list.length === 1 ? "" : "s"}</div>
        <h2 class="prompt">${st[0] ? `${esc(st[0].name)} went deepest` : "Dive over"}</h2>
        <div class="podium">${order.filter((i) => st[i]).map((i) => { const s = st[i]; return `<div class="pod p${i + 1}" style="--c:${s.color}">${i === 0 ? ICON("crown") : `<span class="place">${i + 1}</span>`}<b>${esc(s.name)}</b><span>${F.fmtM(s.metres)}</span>${s.best ? `<small>Deepest: ${esc(s.best[3])}</small>` : ""}</div>`; }).join("")}</div>
        ${standingsHTML(st)}
        ${iAmHost ? `<button class="btn primary wide" type="button" id="mpAgain">${ICON("again")}Play again</button>` : `<p class="hint mp-wait"><span class="spin"></span>Waiting for ${esc(hostName(h))} to start another dive…</p>`}
        <button class="btn ghost" type="button" id="mpLeave">Leave room</button>
      </article>`;
    if (iAmHost) $("#mpAgain").onclick = () => setG({ gid: null, phase: "lobby", seq: -1, list: [] });
    $("#mpLeave").onclick = leave;
  }
})(window);

</script></body></html>
