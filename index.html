<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fathom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Big+Shoulders+Display:wght@700;900&family=Martian+Mono:wght@400;600&display=swap">
<style>
/* Layout: one narrow dive column over a full-bleed ocean canvas that darkens with depth; a sounding gauge rides the left edge on wide screens. Deliberately single-theme (the ocean is always dark). */
:root {
  color-scheme: dark;
  --abyss: #03101c;
  --panel: rgba(4, 20, 34, 0.72);
  --panel-2: rgba(8, 32, 52, 0.66);
  --line: rgba(150, 214, 230, 0.18);
  --line-strong: rgba(150, 214, 230, 0.34);
  --ink: #e6f3f1;
  --ink-dim: #9dbcc3;
  --ink-faint: #6a8d99;
  --lure: #ffb454;
  --lure-ink: #1c1003;
  --coral: #ff7a6b;
  --kelp: #7fd6b0;
  --t0: #a9c0cb;
  --t1: #ff7a6b;
  --t2: #5fd3c4;
  --t3: #b9a2ff;
  --t4: #ffb454;
  --t5: #f6e9ff;
  --display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Martian Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 14px;
  --ease: cubic-bezier(.2,.8,.2,1);
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--abyss); color: var(--ink);
  font: 16px/1.5 var(--body); -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--lure); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- ocean ---------- */
#sea { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; display: block; background: #0f5a78; }
.vignette { position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(120% 90% at 50% 20%, transparent 40%, rgba(0,4,10,.55) 100%); }

/* ---------- gauge ---------- */
.gauge { position: fixed; z-index: 2; left: 22px; top: calc(76px + env(safe-area-inset-top, 0px)); bottom: 28px; width: 150px; display: none; pointer-events: none; }
@media (min-width: 1000px) { .gauge { display: block; } }
.gauge .rail { position: absolute; left: 10px; top: 0; bottom: 0; width: 2px; background: linear-gradient(var(--line-strong), rgba(150,214,230,.06)); }
.gauge .tick { position: absolute; left: 4px; display: flex; align-items: center; gap: 10px; transform: translateY(-50%);
  font: 600 10px/1.2 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-faint); white-space: nowrap; }
.gauge .tick::before { content: ""; width: 14px; height: 1px; background: var(--line-strong); }
.gauge .tick b { font-weight: 600; color: var(--ink-dim); display: block; }
.gauge .tick.land { color: rgba(255,180,84,.62); }
.gauge .tick.land::before { width: 8px; margin-left: 3px; background: rgba(255,180,84,.5); }
.gauge .diver { position: absolute; left: 0; width: 22px; height: 22px; margin-top: -11px; border-radius: 50%;
  background: radial-gradient(circle, var(--lure) 0 4px, rgba(255,180,84,.25) 5px, transparent 11px); transition: top .2s linear; }
.gauge .diver::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 1px solid rgba(255,180,84,.45); animation: sonar 2.4s ease-out infinite; }
@keyframes sonar { from { transform: scale(.4); opacity: 1; } to { transform: scale(1.8); opacity: 0; } }

/* ---------- shell ---------- */
.app { position: relative; z-index: 3; max-width: 640px; margin: 0 auto; padding-inline: 16px; padding-block: 10px 48px; min-height: 100%; box-sizing: border-box; }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; }
.brand { display: inline-flex; align-items: center; gap: 8px; background: none; border: 0; padding: 6px 4px; font: 900 22px/1 var(--display); letter-spacing: .14em; color: var(--ink); }
.brand svg { width: 18px; height: 22px; color: var(--lure); }
.tools { display: flex; gap: 4px; }
.iconbtn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; border: 1px solid transparent; background: transparent; color: var(--ink-dim); transition: background .2s, color .2s, border-color .2s; }
.iconbtn:hover { background: rgba(150,214,230,.08); color: var(--ink); border-color: var(--line); }
.iconbtn svg { width: 21px; height: 21px; }
.screen { animation: rise .55s var(--ease) both; }
@keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.label { font: 600 11px/1.3 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; padding: 0 20px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--panel-2); font-weight: 700; transition: transform .15s var(--ease), background .2s, border-color .2s; }
.btn:hover { border-color: var(--ink-dim); }
.btn:active { transform: scale(.98); }
.btn svg { width: 20px; height: 20px; }
.btn.primary { background: var(--lure); color: var(--lure-ink); border-color: var(--lure); font: 900 22px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; }
.btn.primary:hover { background: #ffc373; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-dim); font-weight: 400; min-height: 40px; padding: 0 10px; }
.btn.ghost:hover { color: var(--ink); border-color: var(--line); }
.btn.wide { width: 100%; }

/* ---------- home ---------- */
.hero { position: relative; padding-block: 18px 8px; display: grid; gap: 10px; }
.wordmark { font: 900 clamp(4.4rem, 21vw, 8.6rem)/.82 var(--display); letter-spacing: .04em; margin: 0; color: var(--ink); }
.wordmark span { display: inline-block; animation: bob 5s ease-in-out infinite; color: #e6f3f1;
  background: linear-gradient(180deg, #f2fbf9 0%, #bfe6ec 55%, #6fb4c4 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.wordmark span:nth-child(2) { animation-delay: -.6s; } .wordmark span:nth-child(3) { animation-delay: -1.2s; }
.wordmark span:nth-child(4) { animation-delay: -1.8s; } .wordmark span:nth-child(5) { animation-delay: -2.4s; } .wordmark span:nth-child(6) { animation-delay: -3s; }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(5px); } }
.line { position: absolute; right: 6px; top: 0; width: 26px; height: 128px; color: var(--ink-faint); }
.line .lead { transform-box: fill-box; transform-origin: 50% 0; animation: swing 4s ease-in-out infinite; }
@keyframes swing { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
.tagline { font-size: 1.12rem; color: var(--ink-dim); max-width: 34ch; margin: 0; }
.tagline b { color: var(--ink); font-weight: 700; }

.section { display: grid; gap: 10px; margin-top: 22px; }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mode { text-align: left; padding: 14px 14px 12px; border-radius: var(--r); border: 1px solid var(--line); background: var(--panel); display: grid; gap: 4px; transition: border-color .2s, background .2s, transform .2s var(--ease); }
.mode:hover { border-color: var(--line-strong); }
.mode[aria-pressed="true"] { border-color: var(--lure); background: rgba(255,180,84,.09); }
.mode .name { display: flex; align-items: center; gap: 8px; font: 800 20px/1.1 var(--display); letter-spacing: .06em; text-transform: uppercase; }
.mode .name svg { width: 20px; height: 20px; color: var(--lure); }
.mode .desc { color: var(--ink-dim); font-size: .92rem; line-height: 1.35; }
.packs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pack[data-pack="all"] { grid-column: 1 / -1; }
@media (min-width: 560px) { .packs { grid-template-columns: repeat(3, 1fr); } .pack[data-pack="all"] { grid-column: auto; } }
.pack { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); text-align: left; min-width: 0; transition: border-color .2s, background .2s; }
.pack:hover { border-color: var(--line-strong); }
.pack svg { width: 22px; height: 22px; flex: none; color: var(--ink-dim); }
.pack .t { display: grid; min-width: 0; }
.pack .t b { font-weight: 700; font-size: .95rem; line-height: 1.2; }
.pack .t small { color: var(--ink-faint); font: 400 11px/1.3 var(--mono); }
.pack[aria-pressed="true"] { border-color: var(--lure); background: rgba(255,180,84,.09); }
.pack[aria-pressed="true"] svg { color: var(--lure); }
.go { margin-top: 20px; }
.go .btn.primary { width: 100%; min-height: 60px; font-size: 26px; }
.go .btn.primary svg { width: 24px; height: 24px; animation: nudge 1.6s ease-in-out infinite; }
@keyframes nudge { 0%,100% { transform: translateY(-2px); } 50% { transform: translateY(3px); } }
.meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; margin-top: 10px; color: var(--ink-faint); font: 400 12px/1.4 var(--mono); }
.meta b { color: var(--ink-dim); font-weight: 600; }

.legend { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
@media (min-width: 560px) { .legend { grid-template-columns: repeat(6, 1fr); } }
.legend .tier { display: grid; justify-items: center; gap: 4px; padding: 12px 6px 10px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); text-align: center; }
.legend .tier svg { width: 34px; height: 34px; }
.legend .tier b { font-size: .82rem; line-height: 1.15; }
.legend .tier small { font: 600 11px/1 var(--mono); color: var(--ink-faint); font-variant-numeric: tabular-nums; }

.lenrow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 10px 12px; }
.stepper { display: flex; align-items: center; gap: 6px; }
.stepper .iconbtn { font: 700 22px/1 var(--body); color: var(--ink); border-color: var(--line); }
.stepper .iconbtn:disabled { opacity: .35; cursor: not-allowed; }
.stepper input { width: 64px; height: 42px; box-sizing: border-box; text-align: center; border-radius: 10px; border: 1px solid var(--line-strong); background: rgba(2,12,22,.6); font: 900 26px/1 var(--display); font-variant-numeric: tabular-nums; -moz-appearance: textfield; appearance: textfield; }
.stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.lenchips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { min-width: 40px; height: 34px; padding: 0 11px; border-radius: 99px; border: 1px solid var(--line); background: transparent; color: var(--ink-dim); font: 600 12px/1 var(--mono); transition: background .2s, border-color .2s, color .2s; }
.chip:hover { border-color: var(--line-strong); color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--lure); color: var(--lure-ink); border-color: var(--lure); }
.lenmeta { flex-basis: 100%; font: 400 12px/1.4 var(--mono); color: var(--ink-faint); }
.segbar { display: grid; justify-items: end; gap: 6px; padding-bottom: 6px; }
.segcount { font: 600 12px/1 var(--mono); color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.segcount b { color: var(--ink); font-size: 16px; }
.segs { display: flex; gap: 2px; width: min(44vw, 240px); }
.segs i { flex: 1; height: 8px; border-radius: 2px; background: rgba(150,214,230,.14); transition: background .4s; }
.segs i.now { background: var(--ink); animation: flicker 1.2s steps(2) infinite; }
.segs i.miss { background: rgba(150,214,230,.32); }
.segs i.t0 { background: var(--t0); } .segs i.t1 { background: var(--t1); } .segs i.t2 { background: var(--t2); }
.segs i.t3 { background: var(--t3); } .segs i.t4 { background: var(--t4); } .segs i.t5 { background: var(--t5); box-shadow: 0 0 6px rgba(246,233,255,.8); }

.streak { display: inline-flex; align-items: center; gap: 6px; margin-top: 7px; padding: 5px 10px; border-radius: 99px; width: max-content; font: 600 11px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-dim); border: 1px solid var(--line-strong); background: rgba(2,12,22,.5); }
.streak svg { width: 13px; height: 13px; color: var(--lure); }
.streak.hot { color: var(--lure-ink); background: var(--lure); border-color: var(--lure); animation: hotpulse 1.8s ease-in-out infinite; }
.streak.hot svg { color: var(--lure-ink); }
.streak.bump { animation: pop .6s var(--ease), hotpulse 1.8s ease-in-out .6s infinite; }
@keyframes hotpulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,180,84,.5); } 50% { box-shadow: 0 0 0 7px rgba(255,180,84,0); } }
.multi { display: inline-block; margin-left: 4px; padding: 2px 7px; border-radius: 99px; background: var(--lure); color: var(--lure-ink); font-weight: 600; font-size: 11px; }
.pearl-note { color: var(--t5) !important; font-weight: 700; }
.linkbtn { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; padding: 0; color: var(--t5); font: inherit; text-decoration: underline dotted; text-underline-offset: 3px; }
.linkbtn svg { width: 18px; height: 18px; }
.cab-head { color: var(--ink-dim); font-size: .95rem; }
.cab-head b { font: 900 34px/1 var(--display); color: var(--t5); margin-right: 4px; }
.cab-bar { height: 8px; margin-top: 10px; border-radius: 99px; background: rgba(150,214,230,.1); overflow: hidden; }
.cab-bar i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #cdb8ff, var(--t5)); box-shadow: 0 0 10px rgba(246,233,255,.6); transform-origin: 0 50%; animation: grow .9s var(--ease) both; }
.cab-chips { margin-top: 14px; }
.cab-chips .chip { height: 30px; font-size: 11px; }
.cab-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 12px; }
.slot { display: grid; gap: 4px; align-content: start; justify-items: start; padding: 10px; border-radius: 12px; border: 1px solid var(--line); background: rgba(150,214,230,.04); min-width: 0; }
.slot svg { width: 30px; height: 30px; }
.slot b { font-size: .92rem; line-height: 1.2; overflow-wrap: anywhere; color: var(--ink); }
.slot small { color: var(--ink-faint); font-size: .78rem; line-height: 1.3; }
.slot em { font: normal 600 10px/1.3 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-dim); }
.slot.found { border-color: rgba(246,233,255,.45); background: linear-gradient(160deg, rgba(246,233,255,.13), rgba(150,214,230,.03)); }
.slot.found b { color: var(--t5); }
.slot.locked { opacity: .5; }
.slot.locked svg, .slot.seen svg:not([class]) { color: var(--ink-faint); }
.dive-gain small { display: block; margin-top: 8px; font: 700 14px/1.3 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--lure); text-align: center; text-shadow: 0 2px 10px rgba(0,0,0,.6); }
.dive-gain small.np { color: var(--t5); }

/* multiplayer */
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.friends { min-height: 52px; font-size: 1.05rem; }
#friendsEntry .meta { margin-top: 8px; }
.mp-hud { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 12px; font: 600 12px/1 var(--mono); color: var(--ink-dim); }
.roomchip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 99px; border: 1px solid var(--line-strong); text-transform: uppercase; letter-spacing: .08em; color: var(--ink); background: rgba(2,12,22,.5); }
.roomchip svg { width: 16px; height: 16px; }
.conn { display: inline-flex; align-items: center; gap: 6px; }
.conn::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--kelp); box-shadow: 0 0 8px var(--kelp); }
.conn.off::before { background: var(--lure); box-shadow: none; }
.mp-me { margin-left: auto; font-variant-numeric: tabular-nums; }
.field { display: grid; gap: 6px; }
.field input { height: 52px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1.5px solid var(--line-strong); background: rgba(2,12,22,.6); font-size: 1.15rem; outline: none; }
.field input:focus { border-color: var(--ink-dim); box-shadow: 0 0 0 4px rgba(150,214,230,.1); }
.or { display: flex; align-items: center; gap: 10px; color: var(--ink-faint); font: 600 11px/1 var(--mono); text-transform: uppercase; letter-spacing: .1em; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.mp-lead { margin: 0; color: var(--ink-dim); }
.mp-steps { margin: 4px 0 0; padding-left: 20px; color: var(--ink-dim); display: grid; gap: 6px; }
.mp-steps b { color: var(--ink); }
.hint { margin: 0; color: var(--ink-faint); font-size: .88rem; }
.mp-wait { display: flex; align-items: center; gap: 10px; }
.mp-wait .spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line-strong); border-top-color: var(--lure); animation: spin .8s linear infinite; flex: none; }
.code-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.room-code { font: 900 clamp(2.6rem, 12vw, 4.2rem)/1 var(--display); letter-spacing: .08em; color: var(--lure); }
.mp-players { display: flex; flex-wrap: wrap; gap: 6px; }
.pchip { display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px; border-radius: 99px; border: 1px solid var(--line); background: rgba(150,214,230,.05); font-size: .9rem; transition: background .3s, border-color .3s; }
.pchip i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }
.pchip small { color: var(--ink-faint); font-size: .76rem; }
.pchip svg { width: 13px; height: 13px; color: var(--c); }
.pchip.done { border-color: var(--c); background: color-mix(in srgb, var(--c) 16%, transparent); }
.locked-in { padding: 16px; border-radius: 12px; border: 1px dashed var(--line-strong); color: var(--ink-dim); font-size: 1.05rem; }
.locked-in b { color: var(--ink); }
.mp-set { display: grid; gap: 10px; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: rgba(150,214,230,.04); }
.mp-set .row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.stepval { min-width: 44px; text-align: center; font: 900 26px/1 var(--display); font-variant-numeric: tabular-nums; }
.mp-rows { display: grid; gap: 6px; }
.mp-row { display: grid; grid-template-columns: 34px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: rgba(150,214,230,.05); border: 1px solid transparent; animation: rise .45s var(--ease) both; }
.mp-row svg { width: 32px; height: 32px; }
.mp-row .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--c); justify-self: center; opacity: .6; }
.mp-row .who { min-width: 0; }
.mp-row .who b { display: block; color: var(--c); font-size: .85rem; }
.mp-row .who span { color: var(--ink); font-weight: 700; overflow-wrap: anywhere; }
.mp-row .pts { text-align: right; font: 600 13px/1.2 var(--mono); white-space: nowrap; font-variant-numeric: tabular-nums; }
.mp-row .pts small { display: block; color: var(--ink-faint); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; margin-top: 3px; }
.mp-row.me { border-color: var(--line-strong); }
.mp-row.dup .who span { text-decoration: line-through; text-decoration-color: var(--coral); color: var(--ink-dim); }
.mp-row.dup .pts small { color: var(--coral); }
.standings { display: grid; gap: 7px; }
.srow { display: grid; grid-template-columns: 18px minmax(0, 1fr) minmax(60px, 1.6fr) auto; gap: 10px; align-items: center; font-size: .92rem; }
.srow .rk { font: 600 12px/1 var(--mono); color: var(--ink-faint); }
.srow .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--c); font-weight: 700; }
.srow.me .nm::after { content: " (you)"; color: var(--ink-faint); font-weight: 400; }
.srow .track { height: 10px; border-radius: 99px; background: rgba(150,214,230,.08); overflow: hidden; }
.srow .fill { display: block; height: 100%; border-radius: inherit; background: var(--c); transform-origin: 0 50%; animation: grow .9s var(--ease) both; }
.srow .m { font: 600 12px/1 var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.podium { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 8px; align-items: end; }
.pod { display: grid; justify-items: center; gap: 4px; padding: 14px 8px; border-radius: 12px; border: 1px solid color-mix(in srgb, var(--c) 50%, transparent); background: color-mix(in srgb, var(--c) 10%, transparent); text-align: center; min-width: 0; animation: rise .6s var(--ease) both; }
.pod.p1 { padding-block: 24px 18px; box-shadow: 0 0 30px color-mix(in srgb, var(--c) 25%, transparent); }
.pod svg { width: 28px; height: 28px; color: var(--lure); }
.pod .place { font: 600 12px/1 var(--mono); color: var(--ink-faint); }
.pod b { color: var(--c); font: 800 20px/1.1 var(--display); letter-spacing: .03em; overflow-wrap: anywhere; }
.pod > span:not(.place) { font: 900 24px/1 var(--display); font-variant-numeric: tabular-nums; }
.pod small { color: var(--ink-faint); font-size: .78rem; overflow-wrap: anywhere; }
.dtag { position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%); width: var(--tw, 140px); text-align: center; pointer-events: none; }
.dtag b { display: block; color: var(--c); font: 800 14px/1.15 var(--body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 2px 8px rgba(0,0,0,.7); }
.dtag span { display: block; font-size: 12px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; transition: opacity .3s; text-shadow: 0 2px 8px rgba(0,0,0,.7); }
.dtag em { display: block; font: normal 700 13px/1.25 var(--mono); color: var(--lure); opacity: 0; transition: opacity .3s; text-shadow: 0 2px 8px rgba(0,0,0,.7); }
.big-diver.tagged .dtag span, .big-diver.tagged .dtag em { opacity: 1; }
.big-diver.me .dtag b::after { content: " (you)"; font-weight: 400; color: var(--ink-dim); }
.stratum.hit::after { opacity: .5; }
.dive.crowd .st-label { max-width: 40vw; gap: 10px; }
.dive.crowd .st-label b { font-size: clamp(1.1rem, 4.4vw, 3rem); }
.dive.crowd .st-label svg { width: clamp(26px, 5.5vw, 56px); height: clamp(26px, 5.5vw, 56px); }
.dive.crowd .st-label span { font-size: 10px; }
.dive.crowd .st-ghost { display: none; }

/* tier colours */
.c0 { color: var(--t0); } .c1 { color: var(--t1); } .c2 { color: var(--t2); } .c3 { color: var(--t3); } .c4 { color: var(--t4); } .c5 { color: var(--t5); }
.c5 svg, svg.c5 { filter: drop-shadow(0 0 6px rgba(246,233,255,.6)); }

/* ---------- play ---------- */
.hud { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; padding-block: 4px 12px; }
.depth { display: grid; gap: 2px; }
.depth .num { font: 900 clamp(3rem, 14vw, 4.6rem)/.85 var(--display); letter-spacing: .01em; font-variant-numeric: tabular-nums; }
.depth .num small { font-size: .42em; letter-spacing: .06em; color: var(--ink-dim); margin-left: 4px; }
.depth .zone { font: 600 11px/1.3 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--lure); }
.pips { display: flex; gap: 7px; align-items: center; padding-bottom: 6px; }
.pip { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--line-strong); background: transparent; transition: background .4s, border-color .4s, transform .4s var(--ease); }
.pip.now { border-color: var(--ink); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.25); } }
.pip.miss { background: rgba(150,214,230,.12); border-color: rgba(150,214,230,.2); }
.pip.t0 { background: var(--t0); border-color: var(--t0); } .pip.t1 { background: var(--t1); border-color: var(--t1); } .pip.t2 { background: var(--t2); border-color: var(--t2); }
.pip.t3 { background: var(--t3); border-color: var(--t3); } .pip.t4 { background: var(--t4); border-color: var(--t4); } .pip.t5 { background: var(--t5); border-color: var(--t5); box-shadow: 0 0 10px rgba(246,233,255,.8); }
.tanks { display: flex; gap: 6px; padding-bottom: 4px; }
.tank { width: 22px; height: 34px; color: var(--kelp); transition: color .4s, opacity .4s, transform .4s var(--ease); }
.tank.empty { color: var(--ink-faint); opacity: .35; transform: translateY(3px); }
.tank.refill { animation: refill .9s var(--ease); }
@keyframes refill { 0% { transform: scale(.6); } 60% { transform: scale(1.25); } 100% { transform: none; } }
.tank.lost { animation: lost .6s ease-in; }
@keyframes lost { 30% { transform: translateX(-3px) rotate(-8deg); } 60% { transform: translateX(3px) rotate(6deg); } }

.card { padding: 20px 18px 16px; display: grid; gap: 14px; animation: rise .5s var(--ease) both; }
@media (min-width: 560px) { .card { padding: 26px 26px 20px; } }
.prompt { font: 800 clamp(2rem, 8.5vw, 3rem)/1 var(--display); letter-spacing: .01em; }
.timer { position: relative; height: 8px; border-radius: 99px; background: rgba(150,214,230,.12); overflow: hidden; }
.timer i { position: absolute; inset: 0; transform-origin: 0 50%; background: linear-gradient(90deg, var(--kelp), #b6f0d6); border-radius: inherit; }
.timer.low i { background: linear-gradient(90deg, var(--lure), #ffd394); }
.timer.crit i { background: linear-gradient(90deg, var(--coral), #ffb0a6); animation: flicker .5s steps(2) infinite; }
@keyframes flicker { 50% { opacity: .6; } }
.timer.paused i { opacity: .45; }
.clock { display: flex; justify-content: space-between; align-items: center; font: 600 12px/1 var(--mono); color: var(--ink-faint); font-variant-numeric: tabular-nums; }
.clock .sec { color: var(--ink-dim); }
.answer { display: flex; gap: 8px; }
.answer input { flex: 1; min-width: 0; height: 56px; padding: 0 16px; border-radius: 12px; border: 1.5px solid var(--line-strong); background: rgba(2,12,22,.6); font-size: 1.2rem; outline: none; transition: border-color .2s, box-shadow .2s; }
.answer input:focus { border-color: var(--ink-dim); box-shadow: 0 0 0 4px rgba(150,214,230,.1); }
.answer input::placeholder { color: var(--ink-faint); }
.answer .btn.primary { min-height: 56px; font-size: 20px; padding: 0 18px; }
.shake { animation: shake .42s cubic-bezier(.36,.07,.19,.97); }
@keyframes shake { 20%,60% { transform: translateX(-7px); } 40%,80% { transform: translateX(7px); } }
.answer.bad input { border-color: var(--coral); }
.feedback { min-height: 1.5em; font-size: .98rem; color: var(--ink-dim); display: flex; align-items: center; gap: 8px; }
.feedback.bad { color: var(--coral); }
.feedback .spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line-strong); border-top-color: var(--lure); animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.feedback button { background: none; border: 0; color: var(--ink-dim); text-decoration: underline; padding: 0; }
.card-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.card-foot .hint { color: var(--ink-faint); font-size: .85rem; }
.tried { display: flex; flex-wrap: wrap; gap: 6px; }
.tried span { font-size: .82rem; padding: 3px 9px; border-radius: 99px; border: 1px solid rgba(255,122,107,.35); color: #ffb3aa; text-decoration: line-through; text-decoration-color: rgba(255,122,107,.6); }

/* result */
.result { text-align: center; justify-items: center; gap: 8px; }
.result .creature { width: 96px; height: 96px; margin-top: 4px; animation: pop .7s var(--ease) both; }
@keyframes pop { 0% { transform: scale(.3) translateY(30px); opacity: 0; } 60% { transform: scale(1.12); opacity: 1; } 100% { transform: none; } }
.result .tiername { font: 900 clamp(2.4rem, 11vw, 3.6rem)/.9 var(--display); letter-spacing: .04em; text-transform: uppercase; }
.result .gain { font: 600 14px/1 var(--mono); color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.result .gain b { color: var(--ink); font-size: 18px; }
.result .said { font-size: 1.15rem; }
.result .said b { font-weight: 700; }
.result .note { color: var(--ink-faint); font-size: .88rem; }
.result .blurb { color: var(--ink-dim); max-width: 36ch; }
.reveal { width: 100%; display: grid; gap: 8px; margin-top: 6px; padding-top: 14px; border-top: 1px solid var(--line); text-align: left; }
.reveal .row { display: flex; gap: 10px; align-items: baseline; }
.reveal .row .label { flex: none; width: 84px; }
.reveal .row span:last-child { min-width: 0; }
.reveal .pearl-a { color: var(--t5); font-weight: 700; }
.result .btn.primary { margin-top: 8px; width: 100%; }
.pearl-burst { position: absolute; inset: 0; pointer-events: none; overflow: hidden; border-radius: inherit; }
.pearl-burst i { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: var(--t5); box-shadow: 0 0 10px #fff; animation: burst 1.3s ease-out forwards; }
@keyframes burst { from { transform: translate(0,0) scale(1); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; } }
.float-gain { position: fixed; z-index: 20; pointer-events: none; font: 900 34px/1 var(--display); letter-spacing: .04em; animation: floatup 1.4s var(--ease) forwards; text-shadow: 0 2px 18px rgba(0,0,0,.5); }
@keyframes floatup { from { opacity: 0; transform: translate(-50%, 10px); } 20% { opacity: 1; } to { opacity: 0; transform: translate(-50%, -70px); } }

/* zone banner + toast */
.banner { position: fixed; z-index: 47; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(92vw, 460px); padding: 14px 18px; text-align: center; border-radius: var(--r);
  background: rgba(2,10,18,.86); border: 1px solid var(--line-strong); animation: bannerin 3.6s var(--ease) forwards; pointer-events: none; }
.banner .label { color: var(--lure); }
.banner h3 { font: 900 30px/1 var(--display); letter-spacing: .05em; text-transform: uppercase; margin-top: 4px; }
.banner p { margin: 6px 0 0; color: var(--ink-dim); font-size: .92rem; }
@keyframes bannerin { 0% { opacity: 0; transform: translate(-50%, -16px); } 10%, 82% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -10px); } }
.toast { position: fixed; z-index: 48; left: 50%; top: calc(18px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); padding: 10px 16px; border-radius: 12px; background: var(--ink); color: var(--abyss); font-weight: 700; animation: toast 2.2s var(--ease) forwards; }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, -10px); } 12%, 80% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }

/* ---------- end ---------- */
.end-hero { text-align: center; padding: 26px 18px 20px; display: grid; gap: 6px; justify-items: center; }
.end-hero .label { color: var(--ink-dim); }
.end-hero .big { font: 900 clamp(4.2rem, 22vw, 7.4rem)/.82 var(--display); font-variant-numeric: tabular-nums; }
.end-hero .big small { font-size: .36em; color: var(--ink-dim); margin-left: 6px; }
.end-hero .zone { font: 800 22px/1.1 var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--lure); }
.end-hero p { margin: 0; color: var(--ink-dim); max-width: 38ch; }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 99px; background: rgba(255,180,84,.14); border: 1px solid rgba(255,180,84,.5); color: var(--lure); font: 600 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; }
.strip { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.strip svg { width: 30px; height: 30px; animation: pop .6s var(--ease) both; }
.strip .missed { width: 30px; height: 30px; display: grid; place-items: center; color: var(--ink-faint); font: 600 18px/1 var(--mono); }
.log { display: grid; gap: 8px; margin-top: 14px; }
.log-item { display: grid; grid-template-columns: 36px 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; animation: rise .5s var(--ease) both; }
.log-item svg { width: 34px; height: 34px; }
.log-item .q { font-size: .85rem; color: var(--ink-faint); line-height: 1.3; }
.log-item .a { font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
.log-item .a.none { color: var(--ink-faint); font-weight: 400; font-style: italic; }
.log-item .p { font-size: .82rem; color: var(--ink-dim); line-height: 1.35; margin-top: 2px; }
.log-item .p b { color: var(--t5); }
.log-item .pts { text-align: right; font: 600 13px/1.2 var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.log-item .pts small { display: block; color: var(--ink-faint); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; margin-top: 3px; }
.end-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
.end-actions .btn.primary { grid-column: 1 / -1; min-height: 58px; }

/* ---------- modals ---------- */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(1,6,12,.66); display: grid; place-items: center; padding: 16px; animation: fade .25s ease both; }
@keyframes fade { from { opacity: 0; } }
.modal { width: min(560px, 100%); max-height: min(86vh, 760px); overflow: auto; background: #061a2b; border: 1px solid var(--line-strong); border-radius: 18px; padding: 20px 18px 22px; animation: rise .4s var(--ease) both; box-sizing: border-box; }
.modal-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
.modal h2 { font: 900 32px/1 var(--display); letter-spacing: .05em; text-transform: uppercase; }
.modal h3 { font: 800 18px/1.2 var(--display); letter-spacing: .08em; text-transform: uppercase; margin: 18px 0 8px; color: var(--ink-dim); }
.modal p, .modal li { color: var(--ink-dim); }
.modal ol { padding-left: 1.2em; margin: 0; display: grid; gap: 6px; }
.modal b { color: var(--ink); }
.tiers-table { display: grid; gap: 6px; }
.tiers-table .r { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; background: rgba(150,214,230,.05); }
.tiers-table svg { width: 30px; height: 30px; }
.tiers-table .r small { display: block; color: var(--ink-faint); font-size: .82rem; }
.tiers-table .n { font: 600 12px/1.3 var(--mono); text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-dim); }
.zones { display: grid; gap: 4px; font-size: .9rem; }
.zones div { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px dashed var(--line); padding: 5px 0; color: var(--ink-dim); }
.zones div span:last-child { font: 400 12px/1.6 var(--mono); color: var(--ink-faint); font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.stat { padding: 12px; border-radius: 12px; background: rgba(150,214,230,.06); border: 1px solid var(--line); }
.stat b { display: block; font: 900 30px/1 var(--display); color: var(--ink); font-variant-numeric: tabular-nums; }
.stat span { font: 600 10px/1.3 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); }
.bars { display: grid; gap: 8px; }
.bars .r { display: grid; grid-template-columns: 26px 92px 1fr 34px; gap: 8px; align-items: center; font-size: .88rem; }
.bars svg { width: 24px; height: 24px; }
.bars .track { height: 10px; border-radius: 99px; background: rgba(150,214,230,.08); overflow: hidden; }
.bars .fill { height: 100%; border-radius: inherit; background: currentColor; transform-origin: 0 50%; animation: grow .9s var(--ease) both; }
@keyframes grow { from { transform: scaleX(0); } }
.bars .n { font: 600 12px/1 var(--mono); text-align: right; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.recent { display: grid; gap: 4px; font: 400 12px/1.6 var(--mono); color: var(--ink-dim); }
.recent div { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px dashed var(--line); padding: 4px 0; }
.setting { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.setting > div { min-width: 0; }
.setting b { display: block; }
.setting small { color: var(--ink-faint); font-size: .85rem; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 10px; overflow: hidden; flex: none; }
.seg button { border: 0; background: transparent; padding: 8px 11px; font: 600 12px/1 var(--mono); color: var(--ink-dim); }
.seg button[aria-pressed="true"] { background: var(--lure); color: var(--lure-ink); }
.switch { position: relative; width: 50px; height: 28px; border-radius: 99px; border: 1px solid var(--line-strong); background: rgba(150,214,230,.08); flex: none; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--ink-dim); transition: transform .25s var(--ease), background .2s; }
.switch[aria-checked="true"] { background: rgba(127,214,176,.3); border-color: var(--kelp); }
.switch[aria-checked="true"]::after { transform: translateX(22px); background: var(--kelp); }
.switch:disabled { opacity: .4; cursor: not-allowed; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
.danger { color: var(--coral) !important; }

/* result card: its details rise in once the dive overlay clears */
.res-info { display: grid; gap: 8px; justify-items: center; width: 100%; min-width: 0; }
.res-info > * { animation: rise .5s var(--ease) both; animation-delay: calc(var(--land, 0ms) + 60ms); }
.res-info > :nth-child(2) { animation-delay: calc(var(--land, 0ms) + 120ms); }
.res-info > :nth-child(3) { animation-delay: calc(var(--land, 0ms) + 180ms); }
.res-info > :nth-child(4) { animation-delay: calc(var(--land, 0ms) + 240ms); }
.res-info > :nth-child(n+5) { animation-delay: calc(var(--land, 0ms) + 300ms); }
.res-info .creature { animation: pop .7s var(--ease) both; animation-delay: var(--land, 0ms); }
.result > .btn.primary { animation: rise .45s var(--ease) both; animation-delay: calc(var(--land, 0ms) + 260ms); }

/* the full-screen dive */
.dive { position: fixed; inset: 0; z-index: 45; overflow: hidden; cursor: pointer; background: #020c18; animation: fade .3s ease both; -webkit-tap-highlight-color: transparent; }
.dive.out { animation: diveout .45s ease forwards; pointer-events: none; }
@keyframes diveout { to { opacity: 0; transform: scale(1.04); } }
.dive-world { position: absolute; left: 0; right: 0; top: 0; background: #020c18; will-change: transform; }
.dive-sky { position: absolute; left: 0; right: 0; top: 0; background: radial-gradient(90% 60% at 65% 100%, rgba(120,210,235,.35), transparent 70%), linear-gradient(180deg, #040d15 0%, #0a2638 55%, #246f8c 100%); }
.waterline { position: absolute; left: 0; right: 0; height: 3px; margin-top: -1.5px; z-index: 2; background: rgba(220,248,255,.85); box-shadow: 0 0 18px rgba(200,245,255,.6); }
.waterline::before { content: ""; position: absolute; left: 0; right: 0; top: -11px; height: 12px;
  background: radial-gradient(circle at 10px 12px, transparent 9px, rgba(220,248,255,.55) 9.5px, transparent 11px) 0 0 / 20px 12px repeat-x; animation: wavesL 2.4s linear infinite; }
@keyframes wavesL { to { background-position: 20px 0; } }
.stratum { position: absolute; left: 0; right: 0; border-top: 1px dashed rgba(190,235,245,.2); }
.stratum::after { content: ""; position: absolute; inset: 0; opacity: 0; transition: opacity .5s; pointer-events: none;
  background: linear-gradient(90deg, color-mix(in srgb, var(--tc) 26%, transparent), color-mix(in srgb, var(--tc) 6%, transparent) 70%); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--tc) 50%, transparent); }
.stratum.pass::after { opacity: .3; }
.stratum.land::after { opacity: 1; }
.st-label { position: absolute; z-index: 1; left: max(16px, 5vw); top: 50%; transform: translateY(-50%); transform-origin: left center; display: flex; align-items: center; gap: 14px; opacity: .42; transition: opacity .35s, transform .6s var(--ease); max-width: 58vw; }
.st-label svg { width: clamp(40px, 7vw, 64px); height: clamp(40px, 7vw, 64px); flex: none; }
.st-label b { display: block; font: 900 clamp(1.8rem, 6.4vw, 3.6rem)/.95 var(--display); letter-spacing: .04em; text-transform: uppercase; color: var(--ink); transition: color .4s, text-shadow .4s; }
.st-label span { font: 600 12px/1.5 var(--mono); color: var(--ink-dim); letter-spacing: .06em; font-variant-numeric: tabular-nums; }
.stratum.pass .st-label { opacity: .92; }
.stratum.land .st-label { opacity: 1; transform: translateY(-50%) scale(1.08); }
.stratum.land .st-label b { color: var(--tc); text-shadow: 0 0 28px color-mix(in srgb, var(--tc) 60%, transparent); }
.st-ghost { position: absolute; right: 4%; bottom: 10%; width: clamp(110px, 15vw, 180px); opacity: .08; animation: ghost 10s ease-in-out infinite; pointer-events: none; }
.st-ghost svg { width: 100%; height: auto; display: block; }
@keyframes ghost { 0%,100% { transform: translateX(0); } 50% { transform: translateX(-50px); } }
@media (max-width: 599px) { .st-ghost { display: none; } }
.dive-snow i { position: absolute; border-radius: 50%; background: rgba(215,235,240,.35); animation: snowdrift 6s ease-in-out infinite alternate; }
@keyframes snowdrift { to { transform: translate(9px, 16px); } }
.big-diver { position: absolute; top: 0; left: 0; width: calc(clamp(54px, 7vw, 78px) * var(--ds, 1)); aspect-ratio: 34 / 56; z-index: 3; will-change: transform; pointer-events: none; --lamp: .1; }
.big-diver .diver-body { position: relative; width: 100%; height: 100%; color: var(--c, #eef8f6); transform-origin: 50% 60%; transition: transform .8s var(--ease); filter: drop-shadow(0 4px 12px rgba(0,0,0,.55)); }
.big-diver .diver-body svg { position: relative; width: 100%; height: 100%; display: block; overflow: visible; }
.beam { position: absolute; left: 50%; top: 80%; width: 320%; height: 380%; transform: translateX(-50%); opacity: var(--lamp); pointer-events: none;
  background: radial-gradient(ellipse at 50% 0%, rgba(255,214,150,.42), rgba(255,214,150,.1) 45%, transparent 72%); clip-path: polygon(45% 0, 55% 0, 100% 100%, 0 100%); }
.big-diver.landed .diver-body { transform: rotate(-80deg); animation: hover 3.2s ease-in-out .8s infinite; }
.big-diver.surfaced .diver-body { transform: rotate(180deg); animation: bobs 2.6s ease-in-out .8s infinite; }
.dive-gain { position: absolute; z-index: 4; transform: translateX(-50%); font: 900 clamp(2.4rem, 8vw, 4.4rem)/1 var(--display); letter-spacing: .04em; white-space: nowrap; text-shadow: 0 4px 24px rgba(0,0,0,.6); pointer-events: none; animation: gainpop .8s var(--ease) both; }

(function (G) {

    { key: "herring", name: "Red herring", pts: 8, emoji: "\u{1F3A3}", blurb: "The clever pick everyone reaches for." },
    { key: "reef", name: "Reef", pts: 16, emoji: "\u{1FAB8}", blurb: "Known, but not first to mind." },

      .replace(/[\u0300-\u036f]/g, "")

      .replace(/&/g, " and ")
      .replace(/\+\+/g, " plusplus ")

    if (k.length < 4) return k;
    if (k.endsWith("ies")) return k.slice(0, -3) + "y";

    return String(str || "")
      .split("|")
      .map((x) => x.trim())
      .filter(Boolean)

   their presence to the hub; the hub sends everyone the full list whenever anything changes. */

  G.FATHOM_WEB = true;

    return new Promise((resolve, reject) => {
      let settled = false, open = false, myId = null, hostConn = null;
      const conns = new Map();          // hub only: peerId -> DataConnection
      const table = new Map();          // peerId -> { presence, updatedAt }
      let mine = {};

      let firePending = false, sendPending = false, hbTimer = 0, lastHost = Date.now();
      const lastSeen = new Map();       // hub only: peerId -> last message time

      const PO = G.FATHOM_PEER_OPTS; // test hook: point at a local PeerServer
      const peer = asHost ? (PO ? new G.Peer(PREFIX + name, PO) : new G.Peer(PREFIX + name)) : (PO ? new G.Peer(PO) : new G.Peer());
      live.add(peer); peer.on("close", () => live.delete(peer));
      const settle = (fn, v) => { if (!settled) { settled = true; clearTimeout(timer); fn(v); } };
      const timer = setTimeout(() => { settle(reject, makeErr("network", "timed out")); try { peer.destroy(); } catch (e) {} }, 15000);

      const snapshot = () => {
        const list = [];
        if (myId) list.push({ peer: myId, by: null, isMe: true, sameTab: true, kind: "viewer", guest: false, presence: Object.freeze(Object.assign({}, mine)), updatedAt: Date.now() });
        table.forEach((v, id) => { if (id !== myId) list.push({ peer: id, by: null, isMe: false, sameTab: false, kind: "viewer", guest: false, presence: v.presence, updatedAt: v.updatedAt }); });
        return Object.freeze(list);
      };
      const fire = () => {

/* Website build only: check unlisted answers through the Fathom answer checker (a Cloudflare Worker
   that asks Gemini). Turned on by setting window.FATHOM_JUDGE_URL near the top of index.html. */
(function (G) {
  const url = String(G.FATHOM_JUDGE_URL || "").trim();
  if (!/^https:\/\//.test(url)) return;
  const F = G.F;
  const err = (code) => { const e = new Error(code); e.code = code; return e; };
  G.FATHOM_JUDGE = {
    name: "AI",
    check(p, answer, signal) {
      const tiers = [0, 1, 2, 3, 4].map((t) => F.samples(p, t, 12));
      return fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ q: p.q, answer, tiers }), signal })
        .catch((e) => { throw err(e && e.name === "AbortError" ? "cancelled" : "network"); })
        .then((r) => {
          if (r.status === 429) throw err("rate_limited");
          if (!r.ok) throw err("upstream");
          return r.json();
        });
    },
  };
})(window);

      const a = Math.random() * Math.PI * 2, d = (30 + Math.random() * 70) * (big ? 2.2 : 1);
      s.style.cssText = `left:${x}px;top:${y}px;--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d}px;animation-delay:${Math.random() * 0.15}s`;
      fx.appendChild(s); setTimeout(() => s.remove(), 1600);
    }
  }
  function splash(fx, x, y) {
    const ring = document.createElement("i"); ring.className = "ring"; ring.style.cssText = `left:${x}px;top:${y}px`;
    fx.appendChild(ring); setTimeout(() => ring.remove(), 1000);
    for (let i = 0; i < 16; i++) {
      const d = document.createElement("i"); d.className = "drop";
      const a = Math.PI * (1.1 + Math.random() * 0.8), v = 40 + Math.random() * 90;
      d.style.cssText = `left:${x}px;top:${y}px;--dx:${Math.cos(a) * v}px;--dy:${Math.sin(a) * v}px;animation-delay:${Math.random() * 0.05}s`;
      fx.appendChild(d); setTimeout(() => d.remove(), 900);
    }
  }

  function renderResult(res, dur, hooks) {
    hooks = hooks || {};
    const last = isFixed(Game) ? Game.idx >= Game.prompts.length - 1 : Game.air <= 0;
    const nextLabel = last ? "Surface and see your dive" : "Next prompt";
    const reveal_at = dur ? dur + HOLD[Math.max(0, res.tier)] + 150 : 0;
    let head;
    if (res.tier >= 0) {
      const t = F.TIERS[res.tier];
      head = `${TI(res.tier, "creature")}
        <div class="tiername c${res.tier}">${t.name}</div>
        <div class="gain"><b>+${(res.pts * 10).toLocaleString("en-GB")} m</b> · ${res.base} pts${res.mult > 1 ? ` <span class="multi">${fmtMult(res.mult)} streak</span>` : ""}</div>
        <div class="said">You said <b>${esc(res.answer)}</b></div>
        ${res.fuzzy ? `<div class="note">Read "${esc(res.input)}" as ${esc(res.answer)}.</div>` : ""}
        ${res.judged ? `<div class="note">Not on our chart. ${judgeName} judged it${res.why ? ": " + esc(res.why) : "."}</div>` : ""}
        ${res.newPearl ? `<div class="note pearl-note">New pearl for your cabinet · ${pearlCount()} of ${F.BANK.length}</div>` : ""}
        ${res.find ? `<div class="note find-note">${res.find.isNew ? `New for your field guide: <b>${esc(res.find.c.name)}</b>` : `Spotted a ${esc(res.find.c.name.toLowerCase())} again · seen ${res.find.n} times`}</div>` : ""}
        ${res.broke ? `<div class="note">That ended your ${res.broke}-answer streak.</div>` : res.streak === 2 ? `<div class="note">Two in a row. One more Reef or deeper starts a streak bonus.</div>` : ""}
        <div class="blurb">${esc(t.blurb)}${hooks.airBack ? " You got a tank of air back." : ""}</div>`;
    } else {
      head = `<div class="tiername" style="color:var(--ink-dim)">${res.kind === "passed" ? "Let it go" : "Out of time"}</div>
        <div class="gain"><b>+0 m</b></div>
        ${res.broke ? `<div class="note">That ended your ${res.broke}-answer streak.</div>` : ""}
        ${Game.mode === "endless" ? `<div class="blurb">You stayed at the surface, and it cost a tank. ${Game.air} left.</div>` : `<div class="blurb">You stayed at the surface. No depth from this one.</div>`}`;
    }
    $("#stage").innerHTML = `<article class="panel card result" id="rcard" style="position:relative;--land:${reveal_at}ms">
      <div class="res-info">${head}${reveal(res.p, res)}</div>
      <button class="btn primary" type="button" id="next">${last ? ICON("dive") : ICON("down")}${nextLabel}</button>
    </article>`;
    const nb = $("#next"); nb.onclick = () => nextPrompt();
    if (dur) diveOverlay(res, dur, hooks);
    else { hooks.land && hooks.land(); hooks.done && hooks.done(); setTimeout(() => nb.focus({ preventScroll: true }), 60); }
  }

  function paintProgress(airBack, airLost) {
    const el = $("#progress");
    if (isFixed(Game) && Game.prompts.length > 8) {
      const n = Game.prompts.length;
      el.className = "segbar";
      el.innerHTML = `<div class="segcount"><b>${Math.min(Game.idx + 1, n)}</b> / ${n}</div><div class="segs">${Game.prompts.map((p, i) => {
        const r = Game.results[i];
        return `<i class="${r ? (r.tier >= 0 ? "t" + r.tier : "miss") : i === Game.idx ? "now" : ""}"></i>`;
      }).join("")}</div>`;
      el.setAttribute("aria-label", `Prompt ${Game.idx + 1} of ${n}`);
    } else if (isFixed(Game)) {
      el.className = "pips";
      el.innerHTML = Game.prompts.map((p, i) => {
        const r = Game.results[i];
        const cls = r ? (r.tier >= 0 ? "t" + r.tier : "miss") : i === Game.idx ? "now" : "";
        return `<span class="pip ${cls}" title="Prompt ${i + 1}"></span>`;
      }).join("");
      el.setAttribute("aria-label", `Prompt ${Game.idx + 1} of ${Game.prompts.length}`);
    } else {
      el.className = "tanks";

        const full = i < Game.air;
        const cls = !full ? "empty" + (airLost && i === Game.air ? " lost" : "") : airBack && i === Game.air - 1 ? "refill" : "";
        return `<span class="tank ${cls}">${ICON("tank")}</span>`;
      }).join("");
      el.setAttribute("aria-label", `${Game.air} tanks of air left`);

  function paintDepth(m) {
    $("#depthNum").textContent = Math.round(m).toLocaleString("en-GB");
    $("#zoneName").textContent = F.zoneAt(m).name;
  }
  O.onDepth = (m) => { if (!$("#play").hidden) paintDepth(m); };

  function checkZones(a, b) {
    const za = F.zoneAt(a), zb = F.zoneAt(b);
    const lm = F.LANDMARKS.filter((l) => l.at > a && l.at <= b && l.at !== 10935);
    lm.forEach((l) => Game.landmarks.push(l.name));
    if (za !== zb) setTimeout(() => banner("Entering", zb.name, zb.note, zb.at), 700);
    else if (lm.length) setTimeout(() => banner("Passing", lm[lm.length - 1].name, F.fmtM(lm[lm.length - 1].at) + " down.", null), 700);
  }
  function banner(kicker, title, note, at) {
    document.querySelectorAll(".banner").forEach((b) => b.remove());
    const el = document.createElement("div"); el.className = "banner"; el.setAttribute("role", "status");
    el.innerHTML = `<div class="label">${esc(kicker)}${at != null ? " · " + F.fmtM(at) : ""}</div><h3>${esc(title)}</h3><p>${esc(note)}</p>`;
    document.body.appendChild(el); setTimeout(() => el.remove(), 3700);
  }

  // ---------- end ----------
  function endDive(quit) {
    clearTimer();
    Game.over = true;
    const g = Game, st = S.stats;
    const hits = g.results.filter((r) => r.tier >= 0);
    const zone = F.zoneAt(g.depth);
    let newBest = false;
    if (g.results.length) {
      if (g.mode === "classic" && !quit) {
        const n = g.prompts.length, prev = st.bestBy[n] || 0;
        st.dives++; st.total += g.depth; st.prompts += n; st.best = Math.max(st.best, g.depth);
        if (g.depth > prev) { newBest = prev > 0; st.bestBy[n] = g.depth; }
      }
      if (g.mode === "endless") { if (g.depth > st.endlessBest) { newBest = st.endlessBest > 0; st.endlessBest = g.depth; } st.endlessMost = Math.max(st.endlessMost, g.results.length); }
      g.results.forEach((r) => { if (r.tier >= 0) st.tiers[r.tier]++; else st.misses++; });
      st.bestStreak = Math.max(st.bestStreak || 0, g.bestStreak);
      st.recent.unshift({ at: Date.now(), mode: g.mode, pack: g.pack, depth: g.depth, n: g.results.length, len: g.prompts.length, quit: !!quit });
      st.recent = st.recent.slice(0, 12);
      save();
    }
    const news = updateOceanProgress(g.depth);
    if (g.mode === "daily") {
      const d = completeDailyDive(g);
      renderDailyEnd(g.date, { fresh: true, newBest: d.newBest, finds: g.finds });
      notifyDepth(news);
      return;
    }
    const packName = F.PACKS.find((x) => x.key === g.pack).name;
    const strip = g.results.map((r) => (r.tier >= 0 ? TI(r.tier) : `<span class="missed">·</span>`)).join("");
    const lead = g.mode === "endless"
      ? `Out of air after ${g.results.length} prompt${g.results.length === 1 ? "" : "s"}, ${hits.length} answered.`
      : quit ? `You surfaced early after ${g.results.length} of ${g.prompts.length} prompts.` : `${hits.length} of ${g.prompts.length} answered in ${packName.toLowerCase() === "open water" ? "open water" : packName}.`;
    const lms = (g.landmarks.length ? ` You passed the ${g.landmarks.map((n) => n.charAt(0).toLowerCase() + n.slice(1)).join(", ")}.` : "")
      + (g.bestStreak >= 3 ? ` Longest streak: ${g.bestStreak}.` : "")
      + (g.newPearls ? ` ${g.newPearls} new pearl${g.newPearls === 1 ? "" : "s"} for the cabinet.` : "")
      + (g.finds ? ` ${g.finds} new creature${g.finds === 1 ? "" : "s"} for the field guide.` : "");
    $("#end").innerHTML = `
      <div class="panel end-hero">
        ${newBest ? `<span class="badge">${ICON("spark")}New deepest ${g.mode === "endless" ? "endless dive" : g.prompts.length + "-prompt dive"}</span>` : `<div class="label">You reached</div>`}
        <div class="big"><span id="endNum">0</span><small>m</small></div>
        <div class="zone">${esc(zone.name)}</div>
        <p>${esc(lead + lms)}</p>
        <div class="strip">${strip}</div>
      </div>
      <div class="end-actions">
        <button class="btn primary" type="button" id="again">${ICON("again")}Dive again</button>
        <button class="btn" type="button" id="share">${ICON("copy")}Copy result</button>
        <button class="btn" type="button" id="toHome">${ICON("home")}Change waters</button>
      </div>
      <div class="log">${logHTML(g.results)}</div>`;
    show("end");
    countUp($("#endNum"), g.depth);
    $("#again").onclick = () => { SND.init(); startDive(); };
    $("#toHome").onclick = () => showHome();
    $("#share").onclick = () => copyShare(g);
    setTimeout(() => $("#again").focus({ preventScroll: true }), 200);
    notifyDepth(news);
  }
  function logHTML(results) {
    return results.map((r, i) => `
        <div class="panel log-item" style="animation-delay:${Math.min(i, 10) * 60}ms">
          ${r.tier >= 0 ? TI(r.tier) : `<span class="missed" style="font:600 20px/1 var(--mono);color:var(--ink-faint);text-align:center">·</span>`}
          <div style="min-width:0"><div class="q">${esc(r.p.q)}</div>
            <div class="a${r.tier >= 0 ? "" : " none"}">${r.tier >= 0 ? esc(r.answer) : r.kind === "passed" ? "Let it go" : r.kind === "skipped" ? "Not reached" : "No answer"}</div>
            ${r.tier === 5 || !S.settings.spoilers ? "" : `<div class="p">Pearl: <b>${esc(r.p.pearlItem.display)}</b></div>`}</div>
          <div class="pts">${r.tier >= 0 ? "+" + (r.pts * 10).toLocaleString("en-GB") + " m" : "0 m"}<small>${r.tier >= 0 ? F.TIERS[r.tier].name + (r.mult > 1 ? " " + fmtMult(r.mult) : "") : "Miss"}</small></div>
        </div>`).join("");
  }
  function countUp(el, to) {
    if (O.reduced || to === 0) { el.textContent = Math.round(to).toLocaleString("en-GB"); return; }
    const t0 = performance.now(), dur = 1400;
    const step = (now) => { const t = Math.min(1, (now - t0) / dur); el.textContent = Math.round(to * (1 - Math.pow(1 - t, 3))).toLocaleString("en-GB"); if (t < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  }
  function shareText(g) {
    const packName = F.PACKS.find((x) => x.key === g.pack).name;
    const row = g.results.map((r) => (r.tier >= 0 ? F.TIERS[r.tier].emoji : F.MISS_EMOJI)).join("");
    const z = F.zoneAt(g.depth).name;
    return `Fathom · ${g.mode === "endless" ? "Endless" : g.prompts.length + "-prompt dive"} · ${packName}\n${row}\n${F.fmtM(g.depth)} · ${z}${g.bestStreak >= 3 ? " · streak " + g.bestStreak : ""}`;
  }
  function copyShare(g) { copyText(shareText(g)); }
  function copyText(text) {
    const done = () => toast("Copied. Paste it anywhere.");
    try {
      navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text));
    } catch (e) { fallbackCopy(text); }
  }
  function fallbackCopy(text) {
    openModal("Your result", `<p>Copy this and paste it wherever you like.</p><textarea id="shareBox" readonly style="width:100%;min-height:96px;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid var(--line-strong);background:rgba(2,12,22,.6);color:var(--ink);font:14px/1.5 var(--mono)">${esc(text)}</textarea>`);
    const box = $("#shareBox"); box.focus(); box.select();
  }
  function toast(msg) { const el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); el.textContent = msg; document.body.appendChild(el); setTimeout(() => el.remove(), 2300); }

  // ---------- modals ----------
  let modalOpen = null, lastFocus = null;
  function openModal(title, html, onRender) {
    closeModal();
    lastFocus = document.activeElement;
    if (tState && Game && !Game.cur.judging) pauseTimer(true);
    const scrim = document.createElement("div"); scrim.className = "scrim";
    scrim.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><h2>${esc(title)}</h2><button class="iconbtn" type="button" id="mClose" aria-label="Close">${ICON("close")}</button></div><div id="mBody">${html}</div></div>`;
    scrim.addEventListener("click", (e) => { if (e.target === scrim) closeModal(); });
    $("#layer").appendChild(scrim); modalOpen = { scrim, title, onRender };
    $("#mClose").onclick = closeModal;
    onRender && onRender();
    setTimeout(() => $("#mClose") && $("#mClose").focus(), 30);
  }
  function closeModal() {
    if (!modalOpen) return;
    modalOpen.scrim.remove(); modalOpen = null;
    if (tState && Game && Game.cur && !Game.cur.judging && !Game.cur.locked) pauseTimer(false);
    if (lastFocus && lastFocus.focus) try { lastFocus.focus({ preventScroll: true }); } catch (e) {}
  }

  function openHelp() {
    const zones = F.ZONES.map((z) => `<div><span>${esc(z.name)}</span><span>${F.fmtM(z.at)}</span></div>`).join("");
    openModal("How to dive", `
      <ol>
        <li>A prompt appears, like <b>Name a bird</b>. You get ${S.settings.timer} seconds and one accepted answer.</li>
        <li>Obvious answers barely move you. Rare, correct ones sink you deep. Speed earns nothing; the clock only decides whether you answer at all.</li>
        <li>Every point is 10 metres, so each pearl is worth 1,000 m. A perfect seven-prompt dive reaches 7,000 m, the top of the hadal zone.</li>
        <li>Streaks: answer Reef or deeper three times in a row and the third earns ${fmtMult(1.25)}. Each one after adds another quarter, up to double. A shallower answer or a miss ends it.</li>
        <li>Every pearl you find goes in your pearl cabinet, with a slot for each of the ${F.BANK.length} prompts.</li>
        <li>Classic dives are as long as you like. Pick any number of prompts on the home screen, up to the size of the pack.</li>
        <li>A wrong answer is refused, not punished. It only costs the seconds it took. Small typos are forgiven.</li>
        <li>If your answer isn't on our chart, ${judgeName} checks it and grades how rare it is${judgeState === "ready" ? "" : ` (when ${judgeName} is available on this page)`}.</li>
        <li>The daily dive is the same ${F.DAILY_LEN} prompts for every diver that day, with one attempt each. Play on consecutive days to build a day streak.</li>
        <li>Accepted answers sometimes turn up a creature from the depth you've reached that dive. Rarer answers find more, and the rarest creatures live deepest. They go in your field guide.</li>
        <li>The ocean map charts your deepest dive ever. Zones and landmarks reveal themselves as you go deeper.</li>

      </ol>
      <h3>Rarity tiers</h3>
      <div class="tiers-table">${F.TIERS.map((t, i) => `<div class="r">${TI(i)}<div><b>${t.name}</b><small>${esc(t.blurb)}</small></div><div class="n">${t.pts} pts<br>${t.pts * 10} m</div></div>`).join("")}</div>
      <h3>The water column</h3>
      <div class="zones">${zones}</div>

  function countTo(el, from, to, delay, dur) {
    setTimeout(() => {
      const t0 = performance.now();
      const step = (now) => { const t = Math.min(1, (now - t0) / dur); el.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - t, 3))).toLocaleString("en-GB"); if (t < 1 && el.isConnected) requestAnimationFrame(step); };
      requestAnimationFrame(step);
    }, delay);

  let cabFilter = "all";
  function openCabinet() {
    const cab = S.stats.cab, total = F.BANK.length, found = pearlCount();
    const dived = F.BANK.filter((p) => cab[p.id] != null).length;
    const rank = (p) => (cab[p.id] == null ? -2 : cab[p.id]);
    const list = F.BANK.filter((p) => cabFilter === "all" || p.pack === cabFilter).sort((x, y) => rank(y) - rank(x));
    const chips = F.PACKS.map((pk) => {
      const L = F.BANK.filter((q) => pk.key === "all" || q.pack === pk.key), f = L.filter((q) => cab[q.id] === 5).length;
      return `<button type="button" class="chip" data-cab="${pk.key}" aria-pressed="${pk.key === cabFilter}">${pk.key === "all" ? "All" : esc(pk.name)} ${f}/${L.length}</button>`;
    }).join("");
    const slots = list.map((p) => {
      const bt = cab[p.id];
      if (bt === 5) return `<div class="slot found">${TI(5)}<b>${esc(F.prep(p).pearlItem.display)}</b><small>${esc(p.q)}</small></div>`;
      if (bt != null) return `<div class="slot seen">${bt >= 0 ? TI(bt) : ICON("oyster")}<b>?</b><small>${esc(p.q)}</small><em>Best: ${bt >= 0 ? F.TIERS[bt].name : "no answer"}</em></div>`;
      return `<div class="slot locked">${ICON("oyster")}<b>Not dived yet</b><small>${esc(p.q)}</small></div>`;
    }).join("");
    openModal("Pearl cabinet", `
      <div class="cab-head"><b>${found}</b> of ${total} pearls · ${dived} prompts dived<div class="cab-bar"><i style="width:${(found / total) * 100}%"></i></div></div>

      <div class="cab-grid">${slots}</div>`, () => {
      document.querySelectorAll("#mBody .chip[data-cab]").forEach((b) => (b.onclick = () => { cabFilter = b.dataset.cab; openCabinet(); }));
    });
  }

  function refreshSettingsIfOpen() { if (modalOpen && modalOpen.title === "Settings") openSettings(); }

  // ================= Daily dive =================
  function dailyStreakNow() {
    const D = S.stats.daily, t = today();
    return D.last === t || D.last === F.addDays(t, -1) ? D.streak : 0;
  }
  function untilTomorrow() {
    const now = new Date(), m = new Date(now); m.setHours(24, 0, 0, 0);
    const mins = Math.max(1, Math.round((m - now) / 60000)), h = Math.floor(mins / 60);
    return h ? `${h} h ${mins % 60} min` : `${mins} min`;
  }
  const dayLabel = (key, long) => F.parseKey(key).toLocaleDateString("en-GB", long ? { weekday: "long", day: "numeric", month: "long" } : { weekday: "short", day: "numeric", month: "short" });
  const listText = (a) => (a.length < 2 ? a.join("") : a.slice(0, -1).join(", ") + " and " + a[a.length - 1]);

  function renderDailyCard() {
    const el = $("#dailySection"); if (!el) return;
    const key = today(), D = S.stats.daily, rec = D.days[key], run = D.run && D.run.date === key ? D.run : null;

        <button class="btn daily-go" type="button" id="dailyGo">${ICON("down")}${run ? `Resume · ${done} of ${F.DAILY_LEN} done` : "Start daily dive"}</button>`;

    $("#dailyGo").onclick = () => (rec ? showDailyResult(key) : startDaily());
  }

  function startDaily() {
    const key = today(), D = S.stats.daily;
    if (D.days[key]) return showDailyResult(key);
    SND.init();
    Game = newGame("daily", "all");
    Game.date = key;
    Game.prompts = F.generateDailyDive(key);
    if (D.run && D.run.date === key) restoreRun(Game, D.run);
    launch();
  }
  // Rebuild a daily dive that was interrupted (page closed or reloaded) from its saved progress.
  function restoreRun(g, run) {
    (run.results || []).forEach((x, i) => {
      const p = byId.get(x[0]) || g.prompts[i]; if (!p) return;
      g.results.push({ p: F.prep(p), tier: x[1], pts: x[2] || 0, answer: x[3] || null, mult: x[4] || 1, base: x[1] >= 0 ? F.TIERS[x[1]].pts : 0, kind: x[5] || (x[1] < 0 ? "timeout" : undefined) });
    });
    g.depth = run.depth || 0; g.streak = run.streak || 0; g.bestStreak = run.bestStreak || 0;
    // A prompt that was on screen when the page closed counts as a miss, so reloading can't buy time.
    if (run.shown >= g.results.length && g.results.length < g.prompts.length) {
      g.results.push({ p: g.prompts[g.results.length], tier: -1, pts: 0, answer: null, kind: "closed" });
      g.streak = 0;
    }
    g.idx = g.results.length - 1;
  }
  function saveRun() {
    if (!Game || Game.mode !== "daily" || Game.over) return;
    S.stats.daily.run = { date: Game.date, results: Game.results.map((r) => [r.p.id, r.tier, r.pts || 0, r.answer || "", r.mult || 1, r.kind || ""]), depth: Game.depth, streak: Game.streak, bestStreak: Game.bestStreak, shown: Game.idx };
    save();
  }
  function completeDailyDive(g) {
    const D = S.stats.daily, key = g.date;
    D.run = null;
    if (D.days[key]) { save(); return { newBest: false }; }
    const log = g.results.map((r) => [r.p.id, r.tier, r.answer || "", r.pts || 0, r.mult || 1, r.kind || ""]);
    for (let i = g.results.length; i < g.prompts.length; i++) log.push([g.prompts[i].id, -1, "", 0, 1, "skipped"]);
    const score = g.results.reduce((a, r) => a + (r.pts || 0), 0);
    const answered = g.results.filter((r) => r.tier >= 0).length;
    D.days[key] = { depth: g.depth, score, answered, total: g.prompts.length, bestStreak: g.bestStreak, log, at: Date.now() };
    if (!D.last || D.last < key) {
      D.streak = D.last === F.addDays(key, -1) ? D.streak + 1 : 1;
      D.last = key;
    }
    D.bestStreak = Math.max(D.bestStreak, D.streak);
    const newBest = D.best > 0 && g.depth > D.best;
    D.best = Math.max(D.best, g.depth);
    D.played++;
    Object.keys(D.days).sort().slice(0, -45).forEach((k) => { delete D.days[k].log; }); // keep old days light
    save();
    return { newBest };
  }
  // A daily dive left unfinished on an earlier day is closed out as it stood.
  function finalizeStaleRun() {
    const run = S.stats.daily.run;
    if (!run || run.date === today()) return;
    const g = newGame("daily", "all"); g.date = run.date; g.prompts = F.generateDailyDive(run.date);
    restoreRun(g, run); g.over = true;
    updateOceanProgress(g.depth);
    completeDailyDive(g);
  }
  function confirmSurfaceDaily() {

      <div class="confirm"><button type="button" class="btn danger" id="yesSurface">Surface and finish</button><button type="button" class="btn ghost" id="noSurface">Keep diving</button></div>`, () => {

  }
  function showDailyResult(key) { renderDailyEnd(key, {}); }

  function dailyShareText(key) {

    return `FATHOM · DAILY DIVE #${F.dailyNumber(key)}\n${row}\nDepth: ${F.fmtM(rec.depth)} · ${F.zoneAt(rec.depth).name}\nScore: ${rec.score} pts · ${rec.answered}/${rec.total} answered${streak >= 2 ? `\n\u{1F525} ${streak}-day streak` : ""}`;
  }

  // ================= Field guide =================
  // After an accepted answer there's a chance to spot something living at the depth this dive has
  // reached. Rarer answers spot more often, and legendary creatures need a Rare find or better.
  function discoverCreature(tier, depth) {
    if (tier < 0) return null;
    if (Math.random() > [0.16, 0.22, 0.3, 0.4, 0.52, 0.8][tier]) return null;
    const here = F.zoneAt(depth), guide = S.stats.guide;
    const pool = F.CREATURES.filter((c) => c.at <= depth && (c.rarity !== "legendary" || tier >= 3));
    if (!pool.length) return null;
    const weight = (c) => F.RARITY[c.rarity].w * (guide[c.id] ? 1 : 3) * (F.zoneAt(c.at) === here ? 2 : 1) * (c.rarity === "rare" && tier < 2 ? 0.4 : 1);
    let roll = Math.random() * pool.reduce((a, c) => a + weight(c), 0), c = pool[pool.length - 1];
    for (const x of pool) { roll -= weight(x); if (roll <= 0) { c = x; break; } }
    const had = guide[c.id];
    guide[c.id] = had ? { n: (had.n || 1) + 1, at: had.at } : { n: 1, at: Date.now() };
    save();
    return { c, isNew: !had, n: guide[c.id].n };
  }
  let findOpen = null;
  function showCreatureDiscovery(c) {
    if (!$("#rcard")) { toast("New for your field guide: " + c.name); return; }
    closeFind();
    const el = document.createElement("div"); el.className = "find-scrim";
    el.innerHTML = `<div class="find r-${c.rarity}" role="dialog" aria-modal="true" aria-labelledby="findName">

      <h3 id="findName">${esc(c.name)}</h3>

      <p>${esc(c.desc)}</p>
      <div class="find-meta">Field guide #${c.no} · ${esc(F.zoneAt(c.at).name)} · ${guideCount()} of ${F.CREATURES.length} found</div>
      <button class="btn primary wide" type="button" id="findOk">Add to field guide</button>
    </div>`;
    el.addEventListener("click", (e) => { if (e.target === el) closeFind(); });
    $("#layer").appendChild(el); findOpen = el;
    $("#findOk").onclick = closeFind;
    if (c.rarity === "legendary") SND.pearl(); else SND.accept(Math.min(4, ["common", "uncommon", "rare"].indexOf(c.rarity) + 2));

  function closeFind() {
    if (!findOpen) return;

    const n = $("#next"); if (n) n.focus({ preventScroll: true });
  }
  function renderFieldGuide() {
    const guide = S.stats.guide, total = F.CREATURES.length, found = guideCount(), deep = S.stats.ocean.deepest;
    const groups = [];
    F.CREATURES.forEach((c) => { const z = F.zoneAt(c.at); let g = groups.find((x) => x.z === z); if (!g) groups.push((g = { z, list: [] })); g.list.push(c); });
    let invented = false;
    const secs = groups.map(({ z, list }) => {
      const f = list.filter((c) => guide[c.id]).length, reached = deep >= z.at;
      const note = !invented && z.at > F.INVENTED_BELOW ? ((invented = true), `<p class="gnote">Below Challenger Deep the ocean is invented, and so are its creatures.</p>`) : "";
      const cards = list.map((c) => {
        const g = guide[c.id], R = F.RARITY[c.rarity].name;
        if (g) return `<div class="gc r-${c.rarity}"><span class="emo" aria-hidden="true">${c.emoji}</span><div class="gt"><b>${esc(c.name)}</b><small><i class="rdot"></i>${R} · #${c.no}</small><p>${esc(c.desc)}</p><em>${g.n > 1 ? `Seen ${g.n} times · ` : ""}First found ${new Date(g.at).toLocaleDateString("en-GB", { day: "numeric", month: "short" })}</em></div></div>`;
        return `<div class="gc locked r-${c.rarity}"><span class="emo sil" aria-hidden="true">${c.emoji}</span><div class="gt"><b>???</b><small><i class="rdot"></i>${R} · #${c.no}</small><p>${c.at <= 0 ? "Can turn up on any dive" : reached ? `Turns up in dives past ${F.fmtM(c.at)}` : `Reach ${F.fmtM(c.at)} in one dive to find it`}</p></div></div>`;
      }).join("");
      return `${note}<section class="gz"><div class="gz-head"><b>${esc(z.name)}</b><span>${f} / ${list.length}</span></div><div class="gc-grid">${cards}</div></section>`;
    }).join("");
    openModal("Field guide", `
      <div class="cab-head guide-head"><b>${found}</b> of ${total} discovered · ${Math.round((found / total) * 100)}%<div class="cab-bar"><i style="width:${(found / total) * 100}%"></i></div></div>
      <p class="gnote">Accepted answers sometimes turn up a creature living at the depth your dive has reached. Rarer answers spot more, and legendary creatures only show themselves to a Rare find or better.</p>
      ${secs}`);
  }

  // ================= Ocean map =================
  function updateOceanProgress(depth) {
    const oc = S.stats.ocean, prev = oc.deepest || 0;
    if (!(depth > prev)) return null;
    oc.deepest = depth; oc.at = Date.now(); save();
    const zones = F.ZONES.filter((z) => z.at > prev && z.at <= depth).map((z) => z.name);
    const marks = F.MAP_MARKS.filter((m) => m.at > prev && m.at <= depth && !zones.includes(m.name)).map((m) => m.name);
    return { prev, depth, zones, marks };
  }
  function notifyDepth(n) {
    if (!n) return;
    const found = n.zones.concat(n.marks);
    const proper = (x) => /^The /.test(x) || F.ZONES.some((z) => z.name === x && z.at >= F.INVENTED_BELOW);
    const note = found.length ? "Charted " + listText(found.slice(-3).map((x) => (proper(x) ? x : "the " + x.charAt(0).toLowerCase() + x.slice(1)))) + "." : "Your deepest dive yet. The ocean map has been updated.";
    setTimeout(() => banner("New depth discovered", F.fmtM(n.depth), note, null), 900);
  }
  function renderOceanMap() {
    const st = S.stats, deep = st.ocean.deepest, Z = F.ZONES, guide = st.guide;
    const zi = Z.indexOf(F.zoneAt(deep));
    const inZone = (z) => F.CREATURES.filter((c) => F.zoneAt(c.at) === z);
    const charted = F.MAP_MARKS.filter((m) => deep >= m.at).length;
    const bands = [];
    for (let i = 0; i < Z.length; i++) {
      const z = Z[i], next = Z[i + 1], lo = z.at, hi = next ? next.at : Infinity;
      const L = Math.max(5, 34 - i * 2.4);
      const bg = `linear-gradient(hsl(197 64% ${L}%), hsl(201 68% ${Math.max(3, L - 5)}%))`;
      if (i <= zi) {
        const cs = inZone(z), cf = cs.filter((c) => guide[c.id]).length;
        const items = F.MAP_MARKS.filter((m) => m.at >= lo && m.at < hi && m.name !== z.name).map((m) => ({ at: m.at,
          html: deep >= m.at ? `<li class="mk on"><i></i><span>${esc(m.name)}</span><small>${F.fmtM(m.at)}</small></li>` : `<li class="mk off"><i></i><span>Uncharted</span><small>${F.fmtM(m.at)}</small></li>` }));
        if (deep >= lo && deep < hi) items.push({ at: deep, html: `<li class="mk you"><span class="yd">${ICON("diver")}</span><span>Deepest dive</span><small>${F.fmtM(deep)}</small></li>` });
        const db = st.daily.best;
        if (db && db >= lo && db < hi && db !== deep) items.push({ at: db, html: `<li class="mk dbest"><i></i><span>Best daily dive</span><small>${F.fmtM(db)}</small></li>` });
        items.sort((a, b) => a.at - b.at);
        bands.push(`<section class="oz open${i === zi ? " here" : ""}" style="background:${bg}">
          <div class="oz-head"><b>${esc(z.name)}</b><span>${F.fmtM(lo)}${next ? " – " + F.fmtM(hi) : " and below"}</span></div>
          <p>${esc(z.note)}</p>
          ${items.length ? `<ul class="marks">${items.map((x) => x.html).join("")}</ul>` : ""}
          ${cs.length ? `<div class="oz-foot"><span class="crs" aria-hidden="true">${cs.map((c) => (guide[c.id] ? `<span>${c.emoji}</span>` : `<span class="sil">${c.emoji}</span>`)).join("")}</span><em>${cf} / ${cs.length} creatures</em></div>` : ""}
        </section>`);
      } else if (i === zi + 1) {
        bands.push(`<section class="oz fog" style="background:${bg}"><div class="oz-head"><b aria-hidden="true">${esc(z.name)}</b><span>${F.fmtM(lo)}</span></div><p>Uncharted. Reach ${F.fmtM(lo)} in a single dive to chart it.</p></section>`);
      } else {
        const left = Z.length - i;
        bands.push(`<section class="oz dark"><div class="oz-head"><b>? ? ? ?</b><span>${left} more zone${left === 1 ? "" : "s"}</span></div><p>Nobody has charted this far down.</p></section>`);
        break;
      }
    }
    openModal("Ocean map", `
      <div class="stat-grid map-stats">
        <div class="stat"><b>${F.fmtM(deep)}</b><span>Deepest dive</span></div>
        <div class="stat"><b class="zn">${esc(Z[zi].name)}</b><span>Currently explored</span></div>
        <div class="stat"><b>${guideCount()} / ${F.CREATURES.length}</b><span>Creatures found</span></div>
        <div class="stat"><b>${charted} / ${F.MAP_MARKS.length}</b><span>Landmarks charted</span></div>
      </div>
